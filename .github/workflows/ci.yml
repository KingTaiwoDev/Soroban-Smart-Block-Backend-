name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  non-null-assertion-budget:
    name: Non-null assertion budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce non-null assertion budget
        run: |
          # Issue #1116: track non-null assertions in src/ with a budget that
          # only decreases. Lower MAX when assertions are removed or guarded.
          MAX=145
          COUNT=$(grep -ro '!\.\|)!' src --include='*.ts' | wc -l | tr -d ' ')
          echo "Non-null assertions in src/: $COUNT (budget: $MAX)"
          if [ "$COUNT" -gt "$MAX" ]; then
            echo "::error::Non-null assertion count $COUNT exceeds budget $MAX. Guard the value or lower the budget when removing assertions."
            exit 1
          fi
          echo "OK: No unpinned :latest tags found in compose files."

  # Issue #1235: dependency license policy. Reads package-lock.json only, so no
  # install is needed. See docs/license-policy.md.
  license-policy:
    name: Dependency license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check dependency licenses
        run: npm run licenses:check

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image: the search_engine migration (20260625000000) creates
        # the "vector" extension for embeddings, which plain postgres lacks.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Cache Prisma generate
        uses: actions/cache@v5
        with:
          path: node_modules/.prisma
          key: prisma-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: prisma-

      - name: Install dependencies
        run: npm ci

      - name: Check documented counts and budgets
        run: npm run docs:check

      - name: Enforce per-file TypeScript error budget
        run: npm run typecheck:budget:ci

      - name: Enforce ESLint warning and debt budgets
        run: npm run lint:budget:ci

      - name: Apply schema migrations for PostgreSQL integration tests
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          TESTNET_DATABASE_URL: postgresql://test:test@localhost:5432/test

      # Verification-engine tests exercise SmtSolver.isSatisfiable, which
      # shells out to a real SMT backend; ubuntu-latest runners don't ship z3.
      - name: Install z3 solver
        run: sudo apt-get update -qq && sudo apt-get install -y -qq z3

      # Test-suite coverage guard (#895) — fails CI if the number of test
      # files vitest would collect drops below the tracked floor, or if
      # `test:full` stops being a plain `vitest run` (i.e. a hardcoded file
      # subset sneaks back in). See scripts/verify-test-coverage.ts.
      - name: Verify no test files are silently omitted
        run: npm run test:guard

      # Tracked test-suite debt (#911): every suite excluded from the default
      # run must have a documented record with a reason and re-enable criteria,
      # and the total number of exclusions is capped. See
      # docs/test-suite-debt-tracking.md.
      - name: Verify tracked test-suite exclusions
        run: npm run test:exclusions

      - name: Run full test suite
        run: npm run test:full
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          TESTNET_DATABASE_URL: postgresql://test:test@localhost:5432/test
          STELLAR_NETWORK: testnet
          CONTRACT_ABI_INTEGRATION: '1'
          GAS_FEE_ALERTS_INTEGRATION: '1'

      # Issue #898: Run coverage with threshold enforcement.
      # Vitest exits non-zero if any threshold configured in vitest.config.ts
      # is not met, failing the CI job automatically.
      - name: Run coverage (with threshold enforcement)
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          TESTNET_DATABASE_URL: postgresql://test:test@localhost:5432/test
          STELLAR_NETWORK: testnet
          CACHE_URL: memory://
          CONTRACT_ABI_INTEGRATION: '1'
          GAS_FEE_ALERTS_INTEGRATION: '1'

      - name: Enforce 90% coverage on contract ABI submission code
        run: ts-node --transpile-only scripts/verify-contract-abi-coverage.ts

      - name: Enforce 90% coverage on gas fee alert evaluation and outbox
        run: ts-node --transpile-only scripts/verify-gas-fee-alert-coverage.ts

      # Issue #898: Upload coverage artifacts so reports are inspectable in the
      # GitHub Actions UI for each PR and push. Retained for 30 days.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # DX01/DX02: OpenAPI-first SDKs. The spec is the source of truth; generated
  # clients must match it byte-for-byte (drift fails), API-surface changes
  # must follow semver (docs/sdk/versioning.md), and the quickstart example
  # runs against a live API instance backed by a real Postgres.
  sdk:
    name: SDKs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      TESTNET_DATABASE_URL: postgresql://test:test@localhost:5432/test
      STELLAR_NETWORK: testnet
      CACHE_URL: memory://
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI request and response examples
        run: npm run openapi:check-examples

      - name: Generated SDKs match the OpenAPI spec (drift gate)
        run: npm run sdk:check

      - name: Semver breaking-change gate
        run: npm run sdk:breaking -- --base origin/main

      - name: Build TypeScript SDK (strict, no any in generated code)
        run: |
          npm run sdk:build
          if grep -nE '(:|<|\|)\s*any\b' packages/client/src/generated/*.ts; then
            echo "generated code must not contain any"; exit 1
          fi

      - name: Start API for runnable examples
        run: |
          npx prisma migrate deploy
          PORT=3000 npx ts-node --transpile-only src/index.ts > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3000/livez && exit 0; sleep 2; done
          cat api.log; exit 1

      - name: Smoke-test API against the migrated PostgreSQL database
        run: |
          EXPECTED_MIGRATIONS="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | node -e "let input='';process.stdin.on('data',chunk=>input+=chunk).on('end',()=>console.log(JSON.stringify(input.trim().split('\\n').filter(Boolean))))")"
          EXPECTED_MIGRATIONS="$EXPECTED_MIGRATIONS" npx ts-node --transpile-only src/deployment-smoke.ts

      - name: Run TypeScript quickstart against the live API
        run: npx ts-node --transpile-only packages/client/examples/quickstart.ts
        env:
          SOROBAN_API_URL: http://localhost:3000/api/v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python client tests (stdlib only, real local HTTP server)
        run: python -m unittest discover -s packages/python-client/tests -v

      - name: Python client builds as a wheel
        run: python -m pip wheel --no-deps -w /tmp/wheels packages/python-client

      - name: Run Python quickstart against the live API
        run: python packages/python-client/examples/quickstart.py
        env:
          PYTHONPATH: packages/python-client
          SOROBAN_API_URL: http://localhost:3000/api/v1

  # Issue #908: Validate Prometheus alert rule files with promtool.
  # promtool ships inside the prom/prometheus Docker image; we install it
  # directly from the GitHub release to avoid pulling the full image.
  prometheus-lint:
    name: Prometheus Rules Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install promtool
        run: |
          PROM_VERSION="2.54.0"
          curl -sL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin \
                "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          promtool --version

      - name: Validate Prometheus alert rules
        run: promtool check rules prometheus/alerts.yml prometheus/stellar-rpc-alerts.yml

  # #1036: Postman collection + SDK bundle are generated from the mounted
  # routes; drift against src/api/router.ts fails the build.
  client-artifacts:
    name: Client Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Postman collection drift check
        run: node scripts/generate-postman.js --check

      - name: Generate Postman collection and SDK bundle
        run: |
          node scripts/generate-postman.js --out artifacts
          tar -czf artifacts/client-sdk.tgz -C packages/client package.json README.md src

      - uses: actions/upload-artifact@v4
        with:
          name: client-artifacts
          path: artifacts/
          retention-days: 30

  runtime-security:
    name: Runtime Container Privileges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify runtime privilege restrictions
        run: bash scripts/verify-runtime-privileges.sh

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm audit with tracked, expiring exceptions (#897) — fails the build
      # on any high/critical finding not explicitly documented in
      # .auditignore. Matches the Dockerfile builder stage's policy. See
      # scripts/audit-check.js and docs/audit-exceptions-tracking.md.
      - name: Run npm audit
        run: npm run audit:ci

      # CodeQL runs inside ci.yml's `security` job (not a dedicated workflow)
      # so it matches the repository's code-scanning default-setup configuration
      # (`ci.yml:security` + `javascript`). Analyzing via a different workflow
      # makes the code-scanning check warn that configurations present on main
      # were not found, so `languages` must stay exactly `javascript` (the
      # JavaScript extractor covers TypeScript files too).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
